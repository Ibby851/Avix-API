openapi: 3.0.3
info:
  title: Avix API
  version: 1.0.0
  description: API documentation for the Avix farm management service.
paths:
  /api/core/login/:
    post:
      tags:
        - core
      summary: Log in with username and password
      operationId: core_login_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /api/core/logout/:
    post:
      tags:
        - core
      summary: Log out the current user
      operationId: core_logout_create
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Successful logout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'

  /api/core/accounts/register/:
    post:
      tags:
        - core
      summary: Register a user
      operationId: core_accounts_register_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'

  /api/core/accounts/update/:
    patch:
      tags:
        - core
      summary: Update the current user account
      operationId: core_accounts_update_partial_update
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRegistration'
      responses:
        '200':
          description: Account updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUpdateResponse'

  /api/core/view-profile/:
    get:
      tags:
        - core
      summary: View the current user profile
      operationId: core_view_profile_retrieve
      security:
        - tokenAuth: []
      responses:
        '200':
          description: User profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

  /api/farms/add-farm/:
    post:
      tags:
        - farms
      summary: Register a farm
      operationId: farms_add_farm_create
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FarmRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FarmRegistrationRequest'
      responses:
        '200':
          description: Farm registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmRegistrationResponse'

  /api/farms/farms-list/:
    get:
      tags:
        - farms
      summary: List the farms for the current user
      operationId: farms_farms_list_list
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Farms list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Farm'

  /api/farms/farm-details/{id}/:
    get:
      tags:
        - farms
      summary: Get the details of a farm
      operationId: farms_farm_details_retrieve
      security:
        - tokenAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Farm details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmDetailResponse'

  /api/farms/farm-house-details/{id}/:
    get:
      tags:
        - farms
      summary: Get details of a farm house
      operationId: farms_house_detail_retrieve
      security:
        - tokenAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: House details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'

  /api/farms/farm-house/register-device/:
    post:
      tags:
        - farms
      summary: Register a farm device or bot for a house
      operationId: farms_register_bot_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBotRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterBotRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterBotRequest'
      responses:
        '200':
          description: Bot registration result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterBotResponse'

  /api/farms/add-house/:
    post:
      tags:
        - farms
      summary: Register a house on a farm
      operationId: farms_register_house_create
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterHouseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterHouseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterHouseRequest'
      responses:
        '200':
          description: House registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterHouseResponse'
components:
  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
      required:
        - token

    LogoutResponse:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserRegistration:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        phone_number:
          type: string
        password:
          type: string
          writeOnly: true
        password_confirmation:
          type: string
          writeOnly: true
      required:
        - first_name
        - last_name
        - username
        - email
        - phone_number
        - password
        - password_confirmation

    PatchedUserRegistration:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        phone_number:
          type: string
        password:
          type: string
          writeOnly: true
        password_confirmation:
          type: string
          writeOnly: true

    RegistrationResponse:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AccountUpdateResponse:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Profile:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        phone_number:
          type: string
        farms_count:
          type: integer
        bots_count:
          type: integer
      required:
        - first_name
        - last_name
        - email
        - username
        - phone_number
        - farms_count
        - bots_count

    FarmRegistrationRequest:
      type: object
      properties:
        farm_name:
          type: string
        farm_address:
          type: string
        bird_type:
          type: string
        age:
          type: integer
        population:
          type: integer
      required:
        - farm_name
        - farm_address

    FarmRegistrationResponse:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Farm:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        houses_count:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - address
        - houses_count
        - created_at

    HouseBot:
      type: object
      properties:
        name:
          type: string
        unique_id:
          type: string
      required:
        - name
        - unique_id

    House:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        devices_count:
          type: integer
        tracks:
          type: integer
        zones:
          type: integer
        bots:
          type: array
          items:
            $ref: '#/components/schemas/HouseBot'
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - devices_count
        - tracks
        - zones
        - bots
        - created_at

    FarmDetailResponse:
      type: object
      properties:
        farm_detail:
          $ref: '#/components/schemas/Farm'
        houses_details:
          type: array
          items:
            $ref: '#/components/schemas/House'
      required:
        - farm_detail
        - houses_details

    RegisterBotRequest:
      type: object
      properties:
        id:
          type: integer
          description: House ID
        unique_id:
          type: string
        name:
          type: string
      required:
        - id
        - unique_id
        - name

    RegisterBotResponse:
      type: object
      properties:
        status:
          type: string
        bot_data:
          $ref: '#/components/schemas/HouseBot'
      required:
        - status
        - bot_data

    RegisterHouseRequest:
      type: object
      properties:
        id:
          type: integer
          description: Farm ID
        name:
          type: string
        zones:
          type: integer
        tracks:
          type: integer
      required:
        - id
        - name
        - zones
        - tracks

    RegisterHouseResponse:
      type: object
      properties:
        status:
          type: string
        house_data:
          $ref: '#/components/schemas/House'
      required:
        - status
        - house_data

  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication using the Django REST Framework token scheme.
