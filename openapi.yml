openapi: 3.0.3
info:
  title: Avix API
  version: 1.0.0
  description: API documentation for the Avix farm management service.
paths:
  /api/core/login/:
    post:
      tags:
        - core
      summary: Log in with username and password
      operationId: core_login_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login:
                value:
                  username: alaba_user
                  password: ExamplePass123!
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: '0123456789abcdef0123456789abcdef01234567'
        '400':
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                non_field_errors:
                  - Unable to log in with provided credentials.

  /api/core/logout/:
    post:
      tags:
        - core
      summary: Log out the current user
      operationId: core_logout_create
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Successful logout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                status: success
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/core/accounts/register/:
    post:
      tags:
        - core
      summary: Register a user
      operationId: core_accounts_register_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
            examples:
              registration:
                value:
                  username: alaba_user
                  first_name: Alaba
                  last_name: Adebayo
                  phone_number: "+2348012345678"
                  email: alaba@example.com
                  password: ExamplePass123!
                  password_confirmation: ExamplePass123!
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '200':
          description: Registration succeeded or the request failed validation
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RegistrationResponse'
                  - $ref: '#/components/schemas/ValidationError'
              examples:
                success:
                  value:
                    status: success
                validationError:
                  value:
                    password_confirmation:
                      - Password do not match.

  /api/core/accounts/update/:
    patch:
      tags:
        - core
      summary: Update the current user account
      operationId: core_accounts_update_partial_update
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRegistration'
            example:
              email: alaba@example.com
              first_name: Alaba
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRegistration'
      responses:
        '200':
          description: Account updated or the request failed validation
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AccountUpdateResponse'
                  - $ref: '#/components/schemas/ValidationError'
              examples:
                success:
                  value:
                    status: success
                validationError:
                  value:
                    email:
                      - Enter a valid email address.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/core/view-profile/:
    get:
      tags:
        - core
      summary: View the current user profile
      operationId: core_view_profile_retrieve
      security:
        - tokenAuth: []
      responses:
        '200':
          description: User profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              example:
                first_name: Alaba
                last_name: Adebayo
                email: alaba@example.com
                username: alaba_user
                phone_number: "+2348012345678"
                farms_count: 2
                bots_count: 1
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/farms/add-farm/:
    post:
      tags:
        - farms
      summary: Register a farm
      operationId: farms_add_farm_create
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmRegistrationRequest'
            example:
              farm_name: Green Valley Farm
              farm_address: 12 Farm Road, Ibadan
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FarmRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FarmRegistrationRequest'
      responses:
        '200':
          description: Farm registered or the request failed validation
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Farm'
                  - $ref: '#/components/schemas/ValidationError'
              examples:
                success:
                  value:
                    farm_id: 1
                    name: Green Valley Farm
                    address: 12 Farm Road, Ibadan
                    houses_count: 0
                    workers_count: 0
                    created_at: '2026-10-01T09:30:00Z'
                validationError:
                  value:
                    name:
                      - This field is required.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/farms/farms-list/:
    get:
      tags:
        - farms
      summary: List the farms for the current user
      operationId: farms_farms_list_list
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Farms list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Farm'
              example:
                - farm_id: 1
                  name: Green Valley Farm
                  address: 12 Farm Road, Ibadan
                  houses_count: 2
                  workers_count: 1
                  created_at: '2026-10-01T09:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/farms/farm-details/{id}/:
    get:
      tags:
        - farms
      summary: Get the details of a farm
      operationId: farms_farm_details_retrieve
      security:
        - tokenAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Farm details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmDetailResponse'
              example:
                farm_detail:
                  farm_id: 1
                  name: Green Valley Farm
                  address: 12 Farm Road, Ibadan
                  houses_count: 1
                  workers_count: 0
                  created_at: '2026-10-01T09:30:00Z'
                houses_details:
                  - house_id: 3
                    name: House A
                    devices_count: 1
                    length_m: 30
                    width_m: 20
                    height_m: 5
                    created_at: '2026-10-02T09:30:00Z'
                    bots: []
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/farms/farm-house-details/{id}/:
    get:
      tags:
        - farms
      summary: Get details of a farm house
      operationId: farms_house_detail_retrieve
      security:
        - tokenAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: House details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'
              example:
                house_id: 3
                name: House A
                devices_count: 1
                length_m: 30
                width_m: 20
                height_m: 5
                created_at: '2026-10-02T09:30:00Z'
                bots: []
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/farms/farm-house/register-device/:
    post:
      tags:
        - farms
      summary: Register a farm device or bot for a house
      operationId: farms_register_bot_create
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBotRequest'
            example:
              mac: 00:11:22:33:44:55
              track_label: '001'
              house_id: 3
              zone_count: 2
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterBotRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterBotRequest'
      responses:
        '200':
          description: Bot validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                mac:
                  - This field is required.
        '201':
          description: Bot registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bot'
              example:
                device_id: 7
                mac: 00:11:22:33:44:55
                track_label: '001'
                installed_at: '2026-10-02T09:30:00Z'
                house_id: 3
                zone_count: 2
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/farms/add-house/:
    post:
      tags:
        - farms
      summary: Register a house on a farm
      operationId: farms_register_house_create
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterHouseRequest'
            example:
              farm_id: 1
              name: House A
              length_m: 30
              width_m: 20
              height_m: 5
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterHouseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterHouseRequest'
      responses:
        '200':
          description: House validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                name:
                  - This field is required.
        '201':
          description: House registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'
              example:
                house_id: 4
                name: House A
                devices_count: 0
                length_m: 30
                width_m: 20
                height_m: 5
                created_at: '2026-10-03T09:30:00Z'
                bots: []
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/farms/farm/add-worker/:
    post:
      tags:
        - farms
      summary: Add a worker to a farm
      operationId: farms_add_worker_create
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerRequest'
            example:
              farm_id: 1
              full_name: Ade Kunle
              phone_number: "+2349038384962"
              role: Farm Manager
              shift: day
      responses:
        '200':
          description: Worker validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                phone_number:
                  - Enter a valid phone number.
        '201':
          description: Worker added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
              example:
                full_name: Ade Kunle
                phone_number: "+2349038384962"
                role: Farm Manager
                id: 5
                shift: day
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/farms/farm/send-command/{mac_address}/:
    post:
      tags:
        - farms
      summary: Send a command to a registered bot
      operationId: farms_send_command_create
      security:
        - tokenAuth: []
      parameters:
        - in: path
          name: mac_address
          required: true
          schema:
            type: string
          description: MAC address of the registered bot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Command payload forwarded to the bot.
            example:
              command: start
      responses:
        '200':
          description: Command queued for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
              example:
                status: Command Sent
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No bot is registered with the supplied MAC address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
              example:
                status: Bot not found

components:
  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
      required:
        - token

    LogoutResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
      required:
        - status

    UserRegistration:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        phone_number:
          type: string
        password:
          type: string
          writeOnly: true
        password_confirmation:
          type: string
          writeOnly: true
      required:
        - first_name
        - last_name
        - username
        - email
        - phone_number
        - password
        - password_confirmation

    PatchedUserRegistration:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        phone_number:
          type: string
        password:
          type: string
          writeOnly: true
        password_confirmation:
          type: string
          writeOnly: true

    RegistrationResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
      required:
        - status

    AccountUpdateResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
      required:
        - status

    CommandResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - Command Sent
            - Bot not found
      required:
        - status

    Profile:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        phone_number:
          type: string
        farms_count:
          type: integer
        bots_count:
          type: integer
      required:
        - first_name
        - last_name
        - email
        - username
        - phone_number
        - farms_count
        - bots_count

    FarmRegistrationRequest:
      type: object
      properties:
        farm_name:
          type: string
        farm_address:
          type: string
      required:
        - farm_name
        - farm_address

    Farm:
      type: object
      properties:
        farm_id:
          type: integer
        name:
          type: string
        address:
          type: string
        houses_count:
          type: integer
        workers_count:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
        - farm_id
        - name
        - address
        - houses_count
        - workers_count
        - created_at

    Bot:
      type: object
      properties:
        device_id:
          type: integer
          readOnly: true
        mac:
          type: string
        track_label:
          type: string
        installed_at:
          type: string
          format: date-time
          readOnly: true
        house_id:
          type: integer
        zone_count:
          type: integer
          nullable: true
      required:
        - mac
        - track_label
        - house_id

    House:
      type: object
      properties:
        house_id:
          type: integer
        name:
          type: string
        devices_count:
          type: integer
        length_m:
          type: integer
        width_m:
          type: integer
        height_m:
          type: integer
        bots:
          type: array
          items:
            $ref: '#/components/schemas/Bot'
        created_at:
          type: string
          format: date-time
      required:
        - house_id
        - name
        - devices_count
        - length_m
        - width_m
        - height_m
        - bots
        - created_at

    FarmDetailResponse:
      type: object
      properties:
        farm_detail:
          $ref: '#/components/schemas/Farm'
        houses_details:
          type: array
          items:
            $ref: '#/components/schemas/House'
      required:
        - farm_detail
        - houses_details

    RegisterBotRequest:
      type: object
      properties:
        mac:
          type: string
        track_label:
          type: string
        house_id:
          type: integer
        zone_count:
          type: integer
          nullable: true
      required:
        - mac
        - track_label
        - house_id

    RegisterHouseRequest:
      type: object
      properties:
        farm_id:
          type: integer
        name:
          type: string
        length_m:
          type: integer
        width_m:
          type: integer
        height_m:
          type: integer
      required:
        - farm_id
        - name
        - length_m
        - width_m
        - height_m

    WorkerRequest:
      type: object
      properties:
        farm_id:
          type: integer
        full_name:
          type: string
        phone_number:
          type: string
        role:
          type: string
        shift:
          type: string
          enum:
            - day
            - night
            - any
      required:
        - farm_id
        - full_name
        - phone_number
        - role

    Worker:
      type: object
      properties:
        full_name:
          type: string
        phone_number:
          type: string
        role:
          type: string
        id:
          type: integer
          readOnly: true
        shift:
          type: string
          enum:
            - day
            - night
            - any
      required:
        - full_name
        - phone_number
        - role
        - id
        - shift

    ValidationError:
      type: object
      description: Field names map to validation messages; nested errors may also be returned.
      additionalProperties: true

    AuthenticationError:
      type: object
      properties:
        detail:
          type: string
      required:
        - detail
  responses:
    Unauthorized:
      description: Authentication token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationError'
          example:
            detail: Authentication credentials were not provided.

  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Send the token as `Authorization: Token <key>`."
