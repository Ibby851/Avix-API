openapi: 3.0.3
info:
  title: Avix API
  version: 1.0.0
  description: API reference for Avix account and farm management.
servers:
  - url: /
    description: Current API host
tags:
  - name: Core
    description: Authentication and account endpoints.
  - name: Farms
    description: Farms, houses, devices, and workers.
paths:
  /api/core/login/:
    post:
      tags: [Core]
      operationId: login
      summary: Log in
      description: Exchange a username and password for a DRF authentication token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid credentials or request.
  /api/core/logout/:
    post:
      tags: [Core]
      operationId: logout
      summary: Log out
      description: Delete the current user's authentication token.
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Logout result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          description: Authentication required.
  /api/core/accounts/register/:
    post:
      tags: [Core]
      operationId: registerAccount
      summary: Register an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRegistrationRequest'
      responses:
        '200':
          description: Registration result. Serializer validation errors also use HTTP 200.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StatusResponse'
                  - $ref: '#/components/schemas/ValidationErrors'
  /api/core/accounts/update/:
    patch:
      tags: [Core]
      operationId: updateAccount
      summary: Update the authenticated account
      description: Updates profile fields; this endpoint does not change the account password.
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: Update result. Serializer validation errors also use HTTP 200.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StatusResponse'
                  - $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Authentication required.
  /api/core/view-profile/:
    get:
      tags: [Core]
      operationId: getProfile
      summary: Get the authenticated account profile
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Profile data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Authentication required.
  /api/farms/add-farm/:
    post:
      tags: [Farms]
      operationId: registerFarm
      summary: Register a farm
      description: The farm is assigned to the authenticated user. Optional bird fields are accepted but are not currently saved.
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmRegistrationRequest'
      responses:
        '200':
          description: Farm data or serializer validation errors; both use HTTP 200.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FarmRegistrationResponse'
                  - $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Authentication required.
  /api/farms/farms-list/:
    get:
      tags: [Farms]
      operationId: listFarms
      summary: List the authenticated user's farms
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Farms belonging to the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Farm'
        '401':
          description: Authentication required.
  /api/farms/farm-details/{id}/:
    get:
      tags: [Farms]
      operationId: getFarmDetails
      summary: Get a farm and its houses
      security:
        - tokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Farm ID.
          schema:
            type: integer
      responses:
        '200':
          description: Farm and house details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmDetails'
        '401':
          description: Authentication required.
        '500':
          description: A farm that does not exist is not translated to HTTP 404 by the current view.
  /api/farms/farm-house-details/{id}/:
    get:
      tags: [Farms]
      operationId: getHouseDetails
      summary: Get a house and its devices
      security:
        - tokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: House ID.
          schema:
            type: integer
      responses:
        '200':
          description: House details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'
        '401':
          description: Authentication required.
        '500':
          description: A house that does not exist is not translated to HTTP 404 by the current view.
  /api/farms/farm-house/register-device/:
    post:
      tags: [Farms]
      operationId: registerDevice
      summary: Register a device for a house
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Device registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDeviceSuccess'
        '409':
          description: A device with this unique ID is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageStatusResponse'
        '401':
          description: Authentication required.
        '500':
          description: A house that does not exist is not translated to HTTP 404 by the current view.
  /api/farms/add-house/:
    post:
      tags: [Farms]
      operationId: registerHouse
      summary: Add a house to a farm
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterHouseRequest'
      responses:
        '201':
          description: House registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterHouseSuccess'
        '409':
          description: A house with this name already exists on the farm.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseExistsResponse'
        '401':
          description: Authentication required.
        '500':
          description: A farm that does not exist is not translated to HTTP 404 by the current view.
  /api/farms/farm/add-worker/:
    post:
      tags: [Farms]
      operationId: addWorker
      summary: Add a worker to a farm
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWorkerRequest'
      responses:
        '201':
          description: Worker created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
        '200':
          description: Serializer validation errors are returned with HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '401':
          description: Authentication required.
        '500':
          description: A farm that does not exist is not translated to HTTP 404 by the current view.
  /api/schema/:
    get:
      tags: [Core]
      operationId: getOpenApiSchema
      summary: Get the generated OpenAPI schema
      responses:
        '200':
          description: OpenAPI schema document.
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
            application/yaml:
              schema:
                type: string
components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Send a DRF token as `Authorization: Token <token>`.'
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: success
    MessageStatusResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: fail
        message:
          type: string
    ValidationErrors:
      type: object
      description: Field-keyed serializer errors; keys depend on the submitted data.
      additionalProperties:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
    AccountRegistrationRequest:
      type: object
      required: [username, phone_number, password, password_confirmation]
      properties:
        username:
          type: string
          minLength: 5
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone_number:
          type: string
          description: Phone number accepted by django-phonenumber-field, typically E.164.
        password:
          type: string
          format: password
          writeOnly: true
        password_confirmation:
          type: string
          format: password
          writeOnly: true
          description: Must match password.
    AccountUpdateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 5
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone_number:
          type: string
    Profile:
      type: object
      required: [first_name, last_name, email, username, phone_number, farms_count, bots_count]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        phone_number:
          type: string
        farms_count:
          type: integer
        bots_count:
          type: integer
    FarmRegistrationRequest:
      type: object
      required: [farm_name, farm_address]
      properties:
        farm_name:
          type: string
        farm_address:
          type: string
        bird_type:
          type: string
          description: Accepted for compatibility but not currently saved.
        age:
          type: integer
          description: Accepted for compatibility but not currently saved.
        population:
          type: integer
          description: Accepted for compatibility but not currently saved.
    FarmRegistrationResponse:
      type: object
      required: [name, address, farmer, farm_id]
      properties:
        name:
          type: string
        address:
          type: string
        farmer:
          type: integer
          description: ID of the farm owner.
        farm_id:
          type: integer
    Farm:
      type: object
      required: [id, name, address, houses_count, workers_count, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        houses_count:
          type: integer
        workers_count:
          type: integer
        created_at:
          type: string
          format: date-time
    Bot:
      type: object
      required: [name, unique_id, track_number]
      properties:
        name:
          type: string
        unique_id:
          type: string
        track_number:
          type: integer
    House:
      type: object
      required: [id, name, devices_count, tracks, zones, bots, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        devices_count:
          type: integer
        tracks:
          type: integer
        zones:
          type: object
          additionalProperties: true
          description: JSON data configured for the house's zones.
        bots:
          type: array
          items:
            $ref: '#/components/schemas/Bot'
        created_at:
          type: string
          format: date-time
    FarmDetails:
      type: object
      required: [farm_detail, houses_details]
      properties:
        farm_detail:
          $ref: '#/components/schemas/Farm'
        houses_details:
          type: array
          items:
            $ref: '#/components/schemas/House'
    RegisterDeviceRequest:
      type: object
      required: [id, unique_id, name, track_number]
      properties:
        id:
          type: integer
          description: House ID.
        unique_id:
          type: string
        name:
          type: string
        track_number:
          type: integer
    RegisterDeviceSuccess:
      type: object
      required: [status, bot_data]
      properties:
        status:
          type: string
          example: success
        bot_data:
          $ref: '#/components/schemas/Bot'
    RegisterHouseRequest:
      type: object
      required: [id, name, zones, tracks]
      properties:
        id:
          type: integer
          description: Farm ID.
        name:
          type: string
        zones:
          type: object
          additionalProperties: true
        tracks:
          type: integer
          minimum: 0
    RegisterHouseSuccess:
      type: object
      required: [status, house_data]
      properties:
        status:
          type: string
          example: success
        house_data:
          $ref: '#/components/schemas/House'
    HouseExistsResponse:
      type: object
      required: [status, messagge]
      properties:
        status:
          type: string
          example: fail
        messagge:
          type: string
          description: Property name as currently returned by the API.
    AddWorkerRequest:
      type: object
      required: [farm_id, full_name, phone_number, role]
      properties:
        farm_id:
          type: integer
        full_name:
          type: string
        phone_number:
          type: string
          description: Must be unique across workers.
        role:
          type: string
        shift:
          type: string
          enum: [day, night, any]
          default: any
          description: Optional; defaults to any.
    Worker:
      type: object
      required: [full_name, phone_number, role, id, shift]
      properties:
        full_name:
          type: string
        phone_number:
          type: string
        role:
          type: string
        id:
          type: integer
        shift:
          type: string
          enum: [day, night, any]
